name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Server integration tests
        run: npm test -w server
        timeout-minutes: 10
      - name: Client production build
        run: npm run build
        timeout-minutes: 10
      - name: Verify built bundle is referenced
        run: |
          test -f client/dist/assets/index-*.js
          grep -q 'assets/index-' client/dist/index.html

  deploy:
    name: Deploy to Render
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dabohlgn74is73ftig3g
    steps:
      - name: Trigger Render deploy
        if: env.RENDER_DEPLOY_HOOK_URL != '' || env.RENDER_API_KEY != ''
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Triggering deploy via Render deploy hook"
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          else
            echo "Triggering deploy via Render API"
            curl -fsS -X POST \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}'
          fi